# Автоматический деплой frontend TaskFlow на GitHub Pages.
# Запускается только для ветки main (после того как изменения приняты),
# собирает production-бандл Vite и публикует его на GitHub Pages.
#
# Предварительно в настройках репозитория нужно включить Pages:
#   Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения, необходимые для публикации на GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только один деплой; лишние запуски отменяются.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend for Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install frontend dependencies
        working-directory: Task-2/frontend
        run: npm install

      - name: Build production bundle
        working-directory: Task-2/frontend
        # base задаётся, чтобы ассеты корректно грузились из подпути репозитория
        # на GitHub Pages (https://<user>.github.io/<repo>/).
        run: npx vite build --base=/university/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Task-2/frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
